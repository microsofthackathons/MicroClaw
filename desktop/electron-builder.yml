appId: ai.openclaw.microclaw
productName: MicroClawDesktop
copyright: Copyright © 2026 MicroClaw

directories:
  output: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/microclaw.ico

appx:
  artifactName: MicroClawDesktop-${version}-${arch}.msix
  identityName: MicroClaw.Test
  publisher: CN=MicroClaw Test
  publisherDisplayName: MicroClaw
  applicationId: MicroClaw
  displayName: MicroClaw
  languages:
    - en-US
    - zh-CN
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  capabilities:
    - runFullTrust

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenClaw

extraResources:
  - from: dist/github-copilot-auth-worker.js
    to: github-copilot-auth-worker.js
  - from: src/openclaw-fs-safe-compat.mjs
    to: openclaw-fs-safe-compat.mjs
  - from: src/openclaw-state-owner-compat.mjs
    to: openclaw-state-owner-compat.mjs
  - from: src/openclaw-local-model-compat.mjs
    to: openclaw-local-model-compat.mjs
  - from: src/local-model-sources.json
    to: local-model-sources.json
  - from: ../NOTICE
    to: NOTICE
  - from: resources/node.exe
    to: node.exe
  - from: resources/openclaw/
    to: openclaw/
  - from: resources/openclaw.asar
    to: openclaw.asar
  - from: ../docker-sandbox/Dockerfile
    to: docker-sandbox/Dockerfile
  - from: ../skills/rednote-publisher/
    to: agent-skills/rednote-publisher/

files:
  - dist/**/*
  - renderer/dist/**/*
  - assets/**/*
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,README,readme}"
  - "!**/node_modules/.cache"
