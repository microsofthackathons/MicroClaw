appId: ai.openclaw.microclaw
productName: MicroClawDesktop
copyright: Copyright © 2026 MicroClaw

directories:
  output: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/microclaw.ico

appx:
  artifactName: MicroClawDesktop-${version}-${arch}.msix
  identityName: MicroClaw.Test
  publisher: CN=MicroClaw Test
  publisherDisplayName: MicroClaw
  applicationId: MicroClaw
  displayName: MicroClaw
  languages:
    - en-US
    - zh-CN
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  capabilities:
    - runFullTrust

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenClaw

extraResources:
  - from: dist/github-copilot-auth-worker.js
    to: github-copilot-auth-worker.js
  - from: resources/node.exe
    to: node.exe
  - from: resources/openclaw/
    to: openclaw/
  - from: resources/openclaw.asar
    to: openclaw.asar
  - from: ../appcontainer/bin/Release/net9.0-windows/win-x64/AppContainerLauncher.exe
    to: AppContainerLauncher.exe
  - from: ../appcontainer/sandbox-preload.js
    to: sandbox-preload.js
  - from: ../appcontainer/sandbox-state.js
    to: sandbox-state.js
  - from: ../appcontainer/sandbox-permission.js
    to: sandbox-permission.js
  - from: ../appcontainer/sandbox-fs-hooks.js
    to: sandbox-fs-hooks.js
  - from: ../appcontainer/sandbox-cp-hooks.js
    to: sandbox-cp-hooks.js
  - from: ../appcontainer/sandbox-sensitive.js
    to: sandbox-sensitive.js
  - from: ../appcontainer/path-extraction.js
    to: path-extraction.js
  - from: ../skills/rednote-publisher/
    to: agent-skills/rednote-publisher/

files:
  - dist/**/*
  - renderer/dist/**/*
  - assets/**/*
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,README,readme}"
  - "!**/node_modules/.cache"
