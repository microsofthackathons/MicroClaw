# PR Build
#
# Runs the end-to-end packaging script (build.ps1) on every PR.
# Verifies that the entire pipeline still produces:
#   - Native Windows Node + MXC runtime and WeChat resources
#   - bundled Windows Node host (.NET 10) + official MXC runtime
#   - desktop\release\win-unpacked\ (electron-builder)
#   - dist\microclaw-portable.zip
#   - dist\MicroClawInstaller\ + dist\MicroClawInstaller.zip (PyInstaller)
#
# Runs the language checks and Windows packaging independently on GitHub-hosted
# runners so one failed check does not hide the other results.
#
name: "PR Build"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── ESLint + Prettier + Vitest on JS/TS sources ─────────────────
  # Runs lint, prettier check, and Vitest across the app packages, and lints
  # the source mirrored from the vendored Weixin release.
  lint-js:
    name: Lint, Format & Test (JS/TS)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize temporary directory
        run: |
          # Avoid runneradmin 8.3 aliases in temporary test and build paths.
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @(
            "TEMP=$env:RUNNER_TEMP",
            "TMP=$env:RUNNER_TEMP"
          )

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Verify Node.js
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\windows\node-runtime.ps1
          $node = & node --version
          if ($LASTEXITCODE -ne 0 -or -not (Test-SupportedNodeVersion $node)) {
            throw "Node $node is unsupported by OpenClaw 2026.10.10 (need >=24.16.0 <25 || >=26.1.0; install Node 26)"
          }
          Write-Host "node $node"

      - name: Install dependencies (all packages)
        id: dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($d in '.', 'desktop', 'desktop/renderer') {
            Write-Host "── npm ci in $d ──"
            Push-Location $d
            try {
              npm ci
              if ($LASTEXITCODE -ne 0) { throw "npm ci failed in $d" }
            } finally {
              Pop-Location
            }
          }

      - name: Lint all packages
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting (Prettier)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run format:check

      - name: Run unit tests (Vitest)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm test

  # ── Ruff lint + format on Python sources ────────────────────────
  # Runs `ruff check` and `ruff format --check`. Config lives in
  # pyproject.toml. This job is independent of the JS/TS and packaging jobs.
  lint-python:
    name: Lint & Format (Ruff)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize temporary directory
        run: |
          # Avoid runneradmin 8.3 aliases in temporary test and build paths.
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @(
            "TEMP=$env:RUNNER_TEMP",
            "TMP=$env:RUNNER_TEMP"
          )

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies and Ruff
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff==0.16.3"

      - name: Run ruff check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff check .

      - name: Run ruff format --check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m ruff format --check .

      - name: Run Python unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s tests -v

  # ── Run build.ps1 end-to-end on Windows ─────────────────────────
  # Packaging gets its own runner and reports a result even when a lint/test job fails.
  full-build:
    name: build.ps1 (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Normalize temporary directory
        run: |
          # Avoid runneradmin 8.3 aliases in temporary test and build paths.
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value @(
            "TEMP=$env:RUNNER_TEMP",
            "TMP=$env:RUNNER_TEMP"
          )

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Verify toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\windows\node-runtime.ps1
          $node = & node --version
          if ($LASTEXITCODE -ne 0 -or -not (Test-SupportedNodeVersion $node)) {
            throw "Node $node is unsupported by OpenClaw 2026.10.10 (need >=24.16.0 <25 || >=26.1.0; install Node 26)"
          }
          Write-Host "node $node"
          $sdks = & dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) { throw ".NET 10 SDK is required" }
          Write-Host $sdks

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure NSIS is available
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $have = Get-Command makensis -ErrorAction SilentlyContinue
          $sys = Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not $have -and -not $sys) {
            Write-Host "Installing NSIS via choco..."
            choco install nsis -y --no-progress
          } else {
            Write-Host "NSIS already present."
          }

      - name: Run build.ps1
        run: .\build.ps1 -IncludeInstallerZip

      - name: Build unsigned MSIX
        run: npm run dist:msix --prefix desktop

      - name: Verify build artifacts
        run: |
          $expected = @(
            'dist\microclaw-portable.zip',
            'dist\MicroClawInstaller.zip',
            'dist\MicroClawInstaller'
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if (-not (Get-ChildItem 'desktop\release\MicroClawDesktop-*-x64.msix')) {
            $missing += 'desktop\release\MicroClawDesktop-<version>-x64.msix'
          }
          if ($missing) {
            Write-Host "::error::Missing expected artifacts: $($missing -join ', ')"
            exit 1
          }
          Get-ChildItem dist | Format-Table Name, Length, LastWriteTime

      - name: Validate MSIX contents
        run: |
          Get-ChildItem desktop\release\MicroClawDesktop-*-x64.msix |
            ForEach-Object { .\scripts\windows\validate-msix.ps1 -Path $_.FullName }
